<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#1c2733;--mu:#5b6b7a;--line:#e3e8ee;--ac:#0f766e;--ac2:#e0f2f1;--warn:#9a6700;--chip:#eef1f4}

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px 12px 92px}
h1{font-size:24px;margin:6px 4px 2px}.sub{color:var(--mu);font-size:13px;margin:0 4px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-weight:600}
.btn.go{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.wide{width:100%;margin-bottom:10px}.btn.sm{padding:6px 10px;font-size:13px}.btn.danger{color:#c0392b}
.chip{display:inline-block;border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 14px;margin:4px 4px 0 0;font:inherit;font-size:14px}.chip.on{background:var(--ac);color:#fff;font-weight:700}
table{width:100%;border-collapse:collapse}th,td{padding:6px 3px;text-align:center;font-size:14px}th{color:var(--mu);font-size:12px;font-weight:600}td:first-child,th:first-child{text-align:left}tr+tr td{border-top:1px solid var(--line)}
.lead{color:var(--ac);font-weight:700}.dl{color:var(--warn);font-weight:800}
input,select{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input.n{width:70px;text-align:center;padding:7px 4px}td input.n{width:42px;font-size:13px;padding:6px 2px}.sc{overflow-x:auto}
.need{border-left:5px solid var(--ac)}.big{font-size:22px;font-weight:800;margin:4px 0}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;color:var(--mu);padding:14px 4px;font:inherit;font-size:13px}.nav button.on{color:var(--ac);font-weight:700}
textarea{width:100%;min-height:90px;font:12px monospace;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}#toast.on{opacity:1}
.tag{font-size:11px;padding:2px 8px;border-radius:9px;background:var(--ac2);color:var(--ac);font-weight:600}
.rr input{padding:7px 8px;font-size:14px}.rr td{padding:4px 3px}

:root{--bg:#f5eedc;--card:#fffaf0;--ink:#25302a;--mu:#6d6a58;--line:#e3d6b6;--ac:#2c5e45;--ac2:#e5eedd;--warn:#9c7424;--chip:#eee6cf;--gold:#b8923e}
html,body{background:radial-gradient(circle at 50% -10%,#fbf5e6,var(--bg) 60%)}
h1{font-family:Georgia,"Iowan Old Style",serif;color:var(--ac)}
.card{border-radius:14px;box-shadow:0 1px 0 rgba(184,146,62,.3),0 6px 16px -10px rgba(30,60,40,.35)}
.btn.go{background:linear-gradient(180deg,#34705a,#245039);border-color:#1e4430;color:#fbf0d4;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.chip.on{background:var(--ac);color:#fbf0d4}.nav{background:#fffaf0;border-top:1px solid var(--gold)}
.need{border-left:5px solid var(--gold)}.lead{color:var(--ac)}.tag{background:var(--ac2);color:var(--ac)}

@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
#rev svg{animation:pop .5s ease-out}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--gold)}
.dot.ok{background:#3a8a5f}.dot.bad{background:#b3202a}
</style></head><body><div id="app"></div><div id="toast"></div><div class="nav" id="nav"></div>
<script>
const KEY='continental.v1';
const DEFAULT_RULES=[[6,'2 trios'],[7,'1 trio + 1 run'],[8,'2 runs'],[9,'3 trios'],[10,'2 trios + 1 run'],[11,'1 trio + 2 runs'],[12,'3 runs']];
const uid=()=>Math.random().toString(36).slice(2,10);
let S=load();
const RULES_OK=r=>r.rounds&&r.rounds.length===DEFAULT_RULES.length&&r.rounds.every((x,i)=>+x.cards===DEFAULT_RULES[i][0]&&String(x.need).trim()===DEFAULT_RULES[i][1]);
function confirmRules(s){(s.rulesets||[]).forEach(r=>{if(r.placeholder&&RULES_OK(r)){r.placeholder=false;r.u=Date.now()}})}
function migrate(s){confirmRules(s);if(!s.groups||!s.groups.length){const g={id:uid(),name:'Our group',members:(s.players||[]).map(p=>p.id)};s.groups=[g];s.grp=g.id;(s.games||[]).forEach(x=>{if(!x.group)x.group=g.id})}if(!s.grp||!s.groups.some(g=>g.id===s.grp))s.grp=s.groups[0].id;s.del=s.del||{};s.h2h=s.h2h||[null,null];s.lb=s.lb||'all';s.tab=s.tab||'game';s.lastBackup=s.lastBackup||0;s.score=s.score||{w:-10,m:-10};s.v=2;return s}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&(s.v===1||s.v===2))return migrate(s)}catch(e){}
 const rs={id:uid(),name:'Our rules',u:Date.now(),rounds:DEFAULT_RULES.map(([cards,need])=>({cards,need}))};
 const g0={id:uid(),name:'Our group',members:[]};return{v:2,groups:[g0],grp:g0.id,del:{},players:[],rulesets:[rs],games:[],active:null,tab:'game',lb:'all',h2h:[null,null],open:null,updated:Date.now(),lastBackup:0,score:{w:-10,m:-10}}}
function save(){S.updated=Date.now();localStorage.setItem(KEY,JSON.stringify(S));try{SY.kick()}catch(e){}}
const LL=(en,es)=>S.lang==='es'?es:en;
const sameScore=n=>n===1?S.score.w:S.score.m*n;
const sg=n=>n>0?'+'+n:String(n).replace('-','\u2212');
const pv=v=>{const x=Math.round(+String(v).trim().replace('\u2212','-').replace(',','.'));return isNaN(x)?0:x};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grp=()=>S.groups.find(g=>g.id===S.grp)||S.groups[0];const GP=()=>S.players.filter(p=>grp().members.includes(p.id));const GG=()=>S.games.filter(g=>g.group===grp().id);
const pn=id=>(S.players.find(p=>p.id===id)||{name:'?'}).name;
const rs=id=>S.rulesets.find(r=>r.id===id)||S.rulesets[0];
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2200)}
const total=(g,pid,upto)=>g.rounds.slice(0,upto??g.rounds.length).reduce((a,r)=>a+(+r[pid]||0),0);
const dealerIdx=(g,r)=>(g.players.indexOf(g.firstDealer)+r)%g.players.length;
function winners(g){const t=g.players.map(p=>total(g,p));const m=Math.min(...t);return g.players.filter((p,i)=>t[i]===m)}

 ${r.placeholder?'<div class="mu" style="margin-top:6px">⚠ Example values, not your house rules. Edit any row; they become yours.</div>':''}
 <input style="margin-top:8px" value="${esc(r.name)}" data-rname="${r.id}">
 <table class="rr" style="margin-top:6px"><tr><th>Rd</th><th>Cards</th><th style="text-align:left">Needed</th><th></th></tr>${r.rounds.map((x,i)=>`<tr><td>${i+1}</td><td><input class="n" inputmode="numeric" value="${esc(x.cards)}" data-rr="${i}" data-f="cards"></td><td><input value="${esc(x.need)}" data-rr="${i}" data-f="need"></td><td><button class="btn sm" data-act="delround" data-i="${i}">✕</button></td></tr>`).join('')}</table>
 <button class="btn sm" style="margin-top:8px" data-act="addround">+ Round</button> ${R.length>1?'<button class="btn sm danger" data-act="delr">Delete rule set</button>':''}
 <div class="mu" style="margin-top:6px">A game keeps using the rule set it started with.</div></div>
 <div class="card"><b>Shared backup (Notion)</b><div class="mu" style="margin:4px 0 8px">The same shared backup My Day, Racket Rankings and Pocket CRM use. Saved once a day when you open the app. Restore only adds what is missing and never deletes anything.</div>  <span class="lbl" style="font-size:12px;color:var(--mu)">Pocket CRM address</span><input id="sbUrl" value="${esc(localStorage.getItem('sb.url')||'https://contact-capture.matthias-homan.workers.dev')}" autocapitalize="off">  <span class="lbl" style="font-size:12px;color:var(--mu)">Pocket CRM access token</span><input id="sbTok" type="password" value="${esc(localStorage.getItem('sb.token')||'')}" placeholder="same token as in Pocket CRM" autocapitalize="off" autocomplete="off">  <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn sm" data-act="sbsave">Save</button><button class="btn sm" data-act="sbnow">Back up now</button><button class="btn sm" data-act="sbrestore">Restore</button></div>  <div class="mu" id="sbMsg" style="margin-top:8px"></div><div class="mu">${esc(sbLine())}</div></div>
 <div class="card"><b>Backup</b><div class="mu" style="margin:4px 0 8px">${S.lastBackup?'Last copied '+fmt(S.lastBackup):'Never backed up.'} Copy it to Notes or send it to yourself, and paste it here on a new phone. A copy includes group keys, so keep it private.</div>
 <button class="btn wide" data-act="copybk">Copy backup</button><textarea id="bk" placeholder="Paste a backup here to restore"></textarea><button class="btn wide" style="margin-top:8px" data-act="restore">Restore from pasted backup</button></div>`}
/* ---------- actions ---------- */
const A={
 sbsave:()=>{SB.setup(document.getElementById('sbUrl').value,document.getElementById('sbTok').value);sbMsg(SB.configured()?'Saved. The app now backs itself up once a day.':'Enter the Pocket CRM access token first.',SB.configured());},
 sbnow:async()=>{if(!SB.configured())return sbMsg('Enter the Pocket CRM access token first.',false);sbMsg('Backing up...',true);try{const r=await SB.save(APPID,payload());sbMsg('Backed up'+(r&&r.size_kb?' ('+r.size_kb+' KB)':'')+'.',true)}catch(e){sbMsg(e.message,false)}},
 sbrestore:async()=>{if(!SB.configured())return sbMsg('Enter the Pocket CRM access token first.',false);sbMsg('Loading...',true);let r;try{r=await SB.load(APPID)}catch(e){return sbMsg(e.message,false)}
  const d=r.object;if(!d||d.app!==APPID||!d.data)return sbMsg('That backup does not contain this app\'s data.',false);if(!confirm('Add the latest backup from Notion to this phone? What is here stays; the backup only fills in what is missing.'))return sbMsg('',true);
  const n=merge(d.data);save();render();sbMsg('Restored from the backup of '+new Date(r.at||d.saved).toLocaleString('en-GB')+': '+n+'.',true)},
 grp:e=>{S.grp=e.dataset.g;S.setup=null;S.open=null;save();render()},
 addgrp:()=>{const v=document.getElementById('newg').value.trim();if(!v)return;const g={id:uid(),name:v,members:[],u:Date.now()};S.groups.push(g);S.grp=g.id;S.setup=null;save();render()},
 syncon:async()=>{try{await SY.enable(grp());toast(LL('Sync is on','Sincronización activada'));render()}catch(e){toast(e.offline?LL('No signal. Try again.','Sin señal. Inténtalo otra vez.'):LL('Could not turn on sync','No se pudo activar la sincronización'));render()}},
 syncnow:async()=>{await SY.run();toast(LL('Done','Hecho'))},
 invite:async()=>{try{await SY.invite(grp());render()}catch(e){toast(e.offline?LL('No signal. Try again.','Sin señal. Inténtalo otra vez.'):LL('Could not make a code','No se pudo crear el código'))}},
 joingrp:async()=>{const c=document.getElementById('joincode').value.trim();if(!c)return;try{await SY.join(c);render();toast(LL('Joined','Unido'));SY.run()}catch(e){toast(e.offline?LL('No signal. Try again.','Sin señal. Inténtalo otra vez.'):e.message==='bad'?LL('That code is not valid or was already used','Ese código no es válido o ya se usó'):LL('Could not join','No se pudo unir'))}},
 hist:async()=>{try{await SY.history(grp());render()}catch(e){toast(LL('Could not load versions','No se pudieron cargar las versiones'))}},
 restorev:async e=>{if(!confirm(LL('Replace this group on every phone with that version? Games added after it are removed.','¿Reemplazar este grupo en todos los teléfonos por esa versión? Se quitan las partidas añadidas después.')))return;try{await SY.restore(grp(),+e.dataset.v);render();toast(LL('Restored','Restaurado'));SY.run()}catch(x){toast(LL('Could not restore','No se pudo restaurar'))}},
 rotate:async()=>{if(!confirm(LL('Reset the group key? Every phone, including a lost one, loses access until it joins again with a new invite code. This phone keeps access.','¿Cambiar la clave del grupo? Todos los teléfonos, también el perdido, pierden el acceso hasta volver a unirse con un código nuevo. Este teléfono lo conserva.')))return;try{await SY.rotate(grp());if(SB.configured())SB.save(APPID,payload()).catch(()=>{});render();toast(LL('Key reset. Invite the phones you keep.','Clave cambiada. Invita a los teléfonos que conservas.'))}catch(e){toast(LL('Could not reset the key','No se pudo cambiar la clave'))}},
 unsync:()=>{if(!confirm(LL('Disconnect this phone from the group? Its games stay here but stop syncing.','¿Desconectar este teléfono del grupo? Sus partidas se quedan aquí pero dejan de sincronizarse.')))return;delete grp().sync;save();render()},
 resume:e=>{S.active=e.dataset.g;save();render()},
 tab:e=>{S.tab=e.dataset.v;save();render()},lang:()=>{S.lang=S.lang==='es'?'en':'es';save();render()},
 mvp:e=>{const l=S.setup.sel,i=l.indexOf(e.dataset.p),j=i+(+e.dataset.d);if(i<0||j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];save();render()},
 selp:e=>{const s=S.setup,i=s.sel.indexOf(e.dataset.p);i>=0?s.sel.splice(i,1):s.sel.push(e.dataset.p);render()},
 seld:e=>{S.setup.dealer=e.dataset.p;render()},selr:e=>{S.setup.rules=e.dataset.r;render()},
 addp:()=>{const v=document.getElementById('newp').value.trim();if(!v)return;const p={id:uid(),name:v,u:Date.now()};S.players.push(p);grp().members.push(p.id);S.setup.sel.push(p.id);save();render()},
 start:()=>{const s=S.setup;if(s.sel.length<2)return;const g={id:uid(),group:S.grp,u:Date.now(),date:Date.now(),players:[...s.sel],firstDealer:s.dealer,ruleset:s.rules,rounds:[],done:false,over:false};S.games.push(g);S.active=g.id;save();render()},
 saveround:()=>{const g=S.games.find(x=>x.id===S.active),r={};const wr=document.querySelector('input[name=w]:checked');if(!wr){toast(LL('Tap who won this round first','Toca primero quién ganó la ronda'));return}
  const w=wr.dataset.win,same=document.getElementById('sc_'+w).checked;
  for(const p of g.players)r[p]=pv(document.getElementById('in_'+p).value);
  r._w=w;r._s=same;const cur=g.rounds.length,rule=rs(g.ruleset).rounds[cur]||{};
  g.rounds.push(r);g.u=Date.now();const last=g.rounds.length>=rs(g.ruleset).rounds.length;if(last)g.over=true;
  if(last){const gw=winners(g);REV={last:true,name:gw.map(pn).join(' & '),multi:gw.length>1,rows:g.players.map(p=>[pn(p),r[p],total(g,p),gw.includes(p)]).sort((a,b)=>a[2]-b[2])}}else REV=null;
  save();render();window.scrollTo(0,0)},
 closerev:()=>{REV=null;render();window.scrollTo(0,0)},
 undoround:()=>{const g=S.games.find(x=>x.id===S.active);g.rounds.pop();g.over=false;g.u=Date.now();save();render()},
 abandon:()=>{if(!confirm(T('Discard this game? It will not be saved to the leaderboard.')))return;S.del[S.active]=Date.now();S.games=S.games.filter(g=>g.id!==S.active);S.active=null;save();render()},
 finish:()=>{const g=S.games.find(x=>x.id===S.active);g.done=true;g.u=Date.now();S.active=null;S.tab='lb';save();render();toast(T('Saved to leaderboard'))},
 lbf:e=>{S.lb=e.dataset.v;save();render()},open:e=>{S.open=S.open===e.dataset.g?null:e.dataset.g;render()},
 delgame:e=>{if(!confirm(T('Delete this game and remove it from the leaderboard?')))return;S.del[e.dataset.g]=Date.now();S.games=S.games.filter(g=>g.id!==e.dataset.g);S.open=null;save();render()},
 delp:e=>{const id=e.dataset.p;S.del['p:'+id]=Date.now();if(GG().some(g=>g.players.includes(id))){toast(T('Has saved games, cannot remove'));return}grp().members=grp().members.filter(x=>x!==id);if(!S.groups.some(g=>g.members.includes(id))&&!S.games.some(g=>g.players.includes(id)))S.players=S.players.filter(p=>p.id!==id);S.setup=null;save();render()},
 editr:e=>{S.editRules=e.dataset.r;render()},
 newr:()=>{const r={id:uid(),u:Date.now(),name:'New rules',rounds:[{cards:'',need:''}]};S.rulesets.push(r);S.editRules=r.id;save();render()},
 delr:()=>{if(S.games.some(g=>g.ruleset===S.editRules)){toast(T('Used by saved games'));return}S.del['r:'+S.editRules]=Date.now();S.rulesets=S.rulesets.filter(r=>r.id!==S.editRules);S.editRules=S.rulesets[0].id;save();render()},
 addround:()=>{rs(S.editRules).rounds.push({cards:'',need:''});rs(S.editRules).placeholder=false;rs(S.editRules).u=Date.now();save();render()},
 delround:e=>{const r=rs(S.editRules);if(r.rounds.length>1&&!S.games.some(g=>g.ruleset===r.id)){r.rounds.splice(+e.dataset.i,1);r.placeholder=false;r.u=Date.now();save();render()}else toast(T('Used by saved games or last round'))},
 copybk:async()=>{const t=JSON.stringify(S);try{await navigator.clipboard.writeText(t);S.lastBackup=Date.now();save();toast(T('Backup copied'));render()}catch(e){const ta=document.getElementById('bk');ta.value=t;ta.select();toast(T('Select all and copy'))}},
 restore:()=>{try{const d=JSON.parse(document.getElementById('bk').value);if(!(d.v===1||d.v===2)||!Array.isArray(d.games))throw 0;if(!confirm(T('Replace everything on this phone with the backup?')))return;S=migrate(d);save();render();toast(T('Restored'))}catch(e){toast(T('That is not a valid backup'))}}
};
function winSel(){const g=S.games.find(x=>x.id===S.active);if(!g)return;const wr=document.querySelector('input[name=w]:checked');if(!wr)return;const w=wr.dataset.win,n=g.rounds.length+1;
 g.players.forEach(p=>{const ie=document.getElementById('in_'+p);if(ie)ie.setAttribute('inputmode',p===w?'text':'numeric');const t=document.getElementById('wt_'+p),sm=document.getElementById('sm_'+p),c=document.getElementById('sc_'+p);if(t)t.style.display=p===w?'':'none';if(sm)sm.style.display=p===w?'':'none';if(c&&p!==w)c.checked=false;
  if(p!==w){const e=document.getElementById('in_'+p),v=pv(e.value);if(e.value!==''&&(v===S.score.w||v===sameScore(n)))e.value=''}});
 document.getElementById('in_'+w).value=document.getElementById('sc_'+w).checked?sameScore(n):S.score.w}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&A[t.dataset.act])A[t.dataset.act](t)});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.win!==undefined||t.dataset.same!==undefined)winSel();
 else if(t.dataset.sw){S.score[t.dataset.sw]=pv(t.value)||(t.dataset.sw==='w'?-10:-10);save();render()}
 else if(t.dataset.sel!==undefined){S.h2h[+t.dataset.sel]=t.value||null;save();render()}
 else if(t.dataset.g&&t.dataset.r!==undefined&&t.dataset.p){const g=S.games.find(x=>x.id===t.dataset.g);g.rounds[+t.dataset.r][t.dataset.p]=pv(t.value);g.u=Date.now();save();for(const p of g.players){const c=document.getElementById(`tt_${g.id}_${p}`);if(c)c.textContent=total(g,p)}toast(T('Updated'))}
 else if(t.dataset.gname){const g1=S.groups.find(x=>x.id===t.dataset.gname);g1.name=t.value.trim()||g1.name;g1.u=Date.now();save()}
 else if(t.dataset.pname){{const pp=S.players.find(p=>p.id===t.dataset.pname);pp.name=t.value.trim()||'?';pp.u=Date.now()}save()}
 else if(t.dataset.rname){rs(t.dataset.rname).name=t.value.trim()||'Rules';rs(t.dataset.rname).placeholder=false;rs(t.dataset.rname).u=Date.now();save()}
 else if(t.dataset.rr!==undefined){const r=rs(S.editRules).rounds[+t.dataset.rr];r[t.dataset.f]=t.dataset.f==='cards'?(t.value===''?'':Math.round(+t.value)||''):t.value;rs(S.editRules).placeholder=false;rs(S.editRules).u=Date.now();save()}});
SB.auto(APPID,()=>payload().data?payload():null);render();SY.run();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
