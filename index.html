<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#1c2733;--mu:#5b6b7a;--line:#e3e8ee;--ac:#0f766e;--ac2:#e0f2f1;--warn:#9a6700;--chip:#eef1f4}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#eaf0f5;--mu:#9aabba;--line:#2a3743;--ac:#2dd4bf;--ac2:#12332f;--warn:#f5c04a;--chip:#22303b}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px 12px 92px}
h1{font-size:24px;margin:6px 4px 2px}.sub{color:var(--mu);font-size:13px;margin:0 4px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-weight:600}
.btn.go{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.wide{width:100%;margin-bottom:10px}.btn.sm{padding:6px 10px;font-size:13px}.btn.danger{color:#c0392b}
.chip{display:inline-block;border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 14px;margin:4px 4px 0 0;font:inherit;font-size:14px}.chip.on{background:var(--ac);color:#fff;font-weight:700}
table{width:100%;border-collapse:collapse}th,td{padding:6px 3px;text-align:center;font-size:14px}th{color:var(--mu);font-size:12px;font-weight:600}td:first-child,th:first-child{text-align:left}tr+tr td{border-top:1px solid var(--line)}
.lead{color:var(--ac);font-weight:700}.dl{color:var(--warn);font-weight:800}
input,select{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input.n{width:70px;text-align:center;padding:7px 4px}td input.n{width:42px;font-size:13px;padding:6px 2px}.sc{overflow-x:auto}
.need{border-left:5px solid var(--ac)}.big{font-size:22px;font-weight:800;margin:4px 0}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;color:var(--mu);padding:14px 4px;font:inherit;font-size:13px}.nav button.on{color:var(--ac);font-weight:700}
textarea{width:100%;min-height:90px;font:12px monospace;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}#toast.on{opacity:1}
.tag{font-size:11px;padding:2px 8px;border-radius:9px;background:var(--ac2);color:var(--ac);font-weight:600}
.rr input{padding:7px 8px;font-size:14px}.rr td{padding:4px 3px}
</style></head><body><div id="app"></div><div id="toast"></div><div class="nav" id="nav"></div>
<script>
const KEY='continental.v1';
const DEFAULT_RULES=[[6,'2 trios'],[7,'1 trio + 1 run'],[8,'2 runs'],[9,'3 trios'],[10,'2 trios + 1 run'],[11,'1 trio + 2 runs'],[12,'3 runs']];
const uid=()=>Math.random().toString(36).slice(2,10);
let S=load();
function migrate(s){if(!s.groups||!s.groups.length){const g={id:uid(),name:'Our group',members:(s.players||[]).map(p=>p.id)};s.groups=[g];s.grp=g.id;(s.games||[]).forEach(x=>{if(!x.group)x.group=g.id})}if(!s.grp||!s.groups.some(g=>g.id===s.grp))s.grp=s.groups[0].id;s.del=s.del||{};s.h2h=s.h2h||[null,null];s.lb=s.lb||'all';s.tab=s.tab||'game';s.lastBackup=s.lastBackup||0;s.v=2;return s}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&(s.v===1||s.v===2))return migrate(s)}catch(e){}
 const rs={id:uid(),name:'Our rules',placeholder:true,rounds:DEFAULT_RULES.map(([cards,need])=>({cards,need}))};
 const g0={id:uid(),name:'Our group',members:[]};return{v:2,groups:[g0],grp:g0.id,del:{},players:[],rulesets:[rs],games:[],active:null,tab:'game',lb:'all',h2h:[null,null],open:null,updated:Date.now(),lastBackup:0}}
function save(){S.updated=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grp=()=>S.groups.find(g=>g.id===S.grp)||S.groups[0];const GP=()=>S.players.filter(p=>grp().members.includes(p.id));const GG=()=>S.games.filter(g=>g.group===grp().id);
const pn=id=>(S.players.find(p=>p.id===id)||{name:'?'}).name;
const rs=id=>S.rulesets.find(r=>r.id===id)||S.rulesets[0];
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2200)}
const total=(g,pid,upto)=>g.rounds.slice(0,upto??g.rounds.length).reduce((a,r)=>a+(+r[pid]||0),0);
const dealerIdx=(g,r)=>(g.players.indexOf(g.firstDealer)+r)%g.players.length;
function winners(g){const t=g.players.map(p=>total(g,p));const m=Math.min(...t);return g.players.filter((p,i)=>t[i]===m)}
const fmt=d=>new Date(d).toLocaleDateString(S.lang==='es'?'es-ES':'en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});

function tx(t){const k=t.trim();if(!k)return t;const lead=t.match(/^\s*/)[0],tail=t.match(/\s*$/)[0];

const SB=(()=>{const DEF='https://contact-capture.matthias-homan.workers.dev',K={url:'sb.url',tok:'sb.token',auto:'sb.autoAt',last:'sb.lastOk'};
 const get=(k,d='')=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
 const b64=b=>{let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)},unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 const pipe=async(bytes,st)=>new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(st)).arrayBuffer());
 const api={url:()=>(get(K.url)||DEF).replace(/\/+$/,''),token:()=>get(K.tok),configured:()=>!!get(K.tok),setup(u,t){set(K.url,(u||'').trim());set(K.tok,(t||'').trim())},lastOk:()=>Number(get(K.last,'0'))||0,
  device(){return /Android/.test(navigator.userAgent)?'Android phone':'Browser'},
  async pack(o){const b=new TextEncoder().encode(JSON.stringify(o));if(typeof CompressionStream==='function')return 'gz:'+b64(await pipe(b,new CompressionStream('gzip')));return 'raw:'+b64(b)},
  async unpack(s){const raw=unb64(s.slice(s.indexOf(':')+1));const b=s.startsWith('gz:')?await pipe(raw,new DecompressionStream('gzip')):raw;return JSON.parse(new TextDecoder().decode(b))},
  async call(path,init={}){let res;try{res=await fetch(api.url()+path,Object.assign({},init,{headers:Object.assign({Authorization:'Bearer '+api.token()},init.body?{'Content-Type':'application/json'}:{}),signal:AbortSignal.timeout(45000)}))}catch(e){throw new Error('Could not reach the Pocket CRM service. Check the signal and the address.')}
   const d=await res.json().catch(()=>({}));if(!res.ok)throw new Error(res.status===401?'The access token is wrong. Use the same token as Pocket CRM.':(d.error||'The service said no ('+res.status+').'));return d},
  async save(app,obj){const data=await api.pack(obj);const r=await api.call('/backup/save',{method:'POST',body:JSON.stringify({app,data,device:api.device()})});set(K.last,String(Date.now()));return r.backup},
  async load(app){const r=await api.call('/backup/load?app='+app);return Object.assign({},r,{object:await api.unpack(r.data)})},
  async auto(app,make){if(!api.configured()||!navigator.onLine)return false;if(Date.now()-(Number(get(K.auto,'0'))||0)<20*3600*1000)return false;try{const o=make();if(!o)return false;set(K.auto,String(Date.now()));await api.save(app,o);return true}catch(e){set(K.auto,'0');return false}}};
 return api})();

 return `${gbar()}<h1>Leaderboard</h1><p class="sub">${gs.length} saved game${gs.length>1?'s':''} · ${S.lb==='all'?'since the first one':''}</p>
 <div class="card">${chips}<table style="margin-top:8px"><tr><th>#</th><th>Player</th><th>Wins</th><th>Games</th><th>Win %</th></tr>${ids.map((p,i)=>`<tr><td class="${i?'':'lead'}">${i+1}</td><td><b>${esc(pn(p))}</b></td><td>${st[p].w}</td><td>${st[p].g}</td><td class="${i?'':'lead'}">${Math.round(st[p].w/st[p].g*100)}%</td></tr>`).join('')}</table></div>
 <div class="card"><b>Records</b><div class="mu" style="margin-top:6px;line-height:1.7">${low?`Lowest game total · ${esc(pn(low.p))}, ${low.t}<br>`:''}${streak&&streak[1]>0?`Current streak · ${esc(pn(streak[0]))}, ${streak[1]} win${streak[1]>1?'s':''}<br>`:''}${ids.map(p=>`Average per round · ${esc(pn(p))} ${(st[p].pts/st[p].r).toFixed(1)}`).join('<br>')}</div></div>
 <div class="card"><b>Head to head</b><div class="row" style="margin-top:6px;gap:6px">${opts(0)}${opts(1)}</div>${h2}</div>`}
function vHist(){
 const gs=GG().filter(g=>g.done).sort((a,b)=>b.date-a.date);
 if(!gs.length)return `${gbar()}<h1>History</h1><p class="sub">Every saved game</p><div class="card mu">Nothing saved yet.</div>`;
 return gbar()+`<h1>History</h1><p class="sub">Tap a game to see or correct its rounds</p>`+gs.map(g=>{
  const w=winners(g),o=S.open===g.id;
  let body='';if(o){body=`<div class="sc"><table style="margin-top:8px"><tr><th></th>${g.rounds.map((_,i)=>`<th>R${i+1}</th>`).join('')}<th>Total</th></tr>${g.players.map(p=>`<tr><td>${esc(pn(p))}</td>${g.rounds.map((r,i)=>`<td><input class="n" inputmode="numeric" value="${+r[p]||0}" data-g="${g.id}" data-r="${i}" data-p="${p}"></td>`).join('')}<td class="lead" id="tt_${g.id}_${p}">${total(g,p)}</td></tr>`).join('')}</table></div><div class="mu" style="margin-top:6px">Rules: ${esc(rs(g.ruleset).name)}. Edits recalculate the leaderboard.</div><button class="btn sm danger" style="margin-top:8px" data-act="delgame" data-g="${g.id}">Delete game</button>`}
  return `<div class="card"><div class="row" data-act="open" data-g="${g.id}" style="cursor:pointer"><div><b>${esc(fmtDate(g))}</b><div class="mu">${g.players.map(pn).map(esc).join(', ')}</div></div><span class="tag">${esc(w.map(pn).join(' & '))} won</span></div>${body}</div>`}).join('')}
function GROUPS_CARD(){return `<div class="card"><b>Groups</b><div class="mu" style="margin:4px 0 8px">Each group has its own players, games and leaderboard. Share a group with another phone to keep one shared score.</div>
 ${S.groups.map(g=>`<div class="row" style="margin-top:6px"><input value="${esc(g.name)}" data-gname="${g.id}" style="${g.id===S.grp?'border-color:var(--ac)':''}"><button class="btn sm" data-act="grp" data-g="${g.id}">${g.id===S.grp?'Selected':'Use'}</button><button class="btn sm" data-act="sharegrp" data-g="${g.id}">Share</button></div>`).join('')}
 <div style="display:flex;gap:6px;margin-top:10px"><input id="newg" placeholder="New group name"><button class="btn" data-act="addgrp">Add</button></div>
 <div class="mu" style="margin:12px 0 4px">Join a group someone shared with you</div><textarea id="joincode" placeholder="Paste a group code here"></textarea><button class="btn wide" style="margin-top:8px" data-act="joingrp">Join group</button>
 <div class="mu">A group code holds only that group's players and games. Nothing else from your phone, and no backup access.</div></div>`}
function vMore(){
 const R=S.rulesets;const sel=S.editRules||(S.editRules=R[0].id);const r=rs(sel);
 return `<h1>Players &amp; rules</h1><p class="sub">Set once, used for every game</p>${GROUPS_CARD()}
 <div class="card"><b>Players</b> <span class="mu">${esc(grp().name)}</span>${GP().map(p=>`<div class="row" style="margin-top:6px"><input value="${esc(p.name)}" data-pname="${p.id}"><button class="btn sm danger" data-act="delp" data-p="${p.id}">Remove</button></div>`).join('')||'<div class="mu">None yet. Add players when you start a game.</div>'}<div class="mu" style="margin-top:6px">Renaming keeps past games. Players with saved games cannot be removed.</div></div>
 <div class="card"><b>Rules</b><div>${R.map(x=>`<span class="chip ${sel===x.id?'on':''}" data-act="editr" data-r="${x.id}">${esc(x.name)}</span>`).join('')}<span class="chip" data-act="newr">+ new</span></div>
 ${r.placeholder?'<div class="mu" style="margin-top:6px">⚠ Example values, not your house rules. Edit any row; they become yours.</div>':''}
 <input style="margin-top:8px" value="${esc(r.name)}" data-rname="${r.id}">
 <table class="rr" style="margin-top:6px"><tr><th>Rd</th><th>Cards</th><th style="text-align:left">Needed</th><th></th></tr>${r.rounds.map((x,i)=>`<tr><td>${i+1}</td><td><input class="n" inputmode="numeric" value="${esc(x.cards)}" data-rr="${i}" data-f="cards"></td><td><input value="${esc(x.need)}" data-rr="${i}" data-f="need"></td><td><button class="btn sm" data-act="delround" data-i="${i}">✕</button></td></tr>`).join('')}</table>
 <button class="btn sm" style="margin-top:8px" data-act="addround">+ Round</button> ${R.length>1?'<button class="btn sm danger" data-act="delr">Delete rule set</button>':''}
 <div class="mu" style="margin-top:6px">A game keeps using the rule set it started with.</div></div>
 <div class="card"><b>Shared backup (Notion)</b><div class="mu" style="margin:4px 0 8px">The same shared backup My Day, Racket Rankings and Pocket CRM use. Saved once a day when you open the app. Restore only adds what is missing and never deletes anything.</div>  <span class="lbl" style="font-size:12px;color:var(--mu)">Pocket CRM address</span><input id="sbUrl" value="${esc(localStorage.getItem('sb.url')||'https://contact-capture.matthias-homan.workers.dev')}" autocapitalize="off">  <span class="lbl" style="font-size:12px;color:var(--mu)">Pocket CRM access token</span><input id="sbTok" type="password" value="${esc(localStorage.getItem('sb.token')||'')}" placeholder="same token as in Pocket CRM" autocapitalize="off" autocomplete="off">  <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn sm" data-act="sbsave">Save</button><button class="btn sm" data-act="sbnow">Back up now</button><button class="btn sm" data-act="sbrestore">Restore</button></div>  <div class="mu" id="sbMsg" style="margin-top:8px"></div><div class="mu">${esc(sbLine())}</div></div>
 <div class="card"><b>Backup</b><div class="mu" style="margin:4px 0 8px">${S.lastBackup?'Last copied '+fmt(S.lastBackup):'Never backed up.'} Copy it to Notes or send it to yourself, and paste it here on a new phone.</div>
 <button class="btn wide" data-act="copybk">Copy backup</button><textarea id="bk" placeholder="Paste a backup here to restore"></textarea><button class="btn wide" style="margin-top:8px" data-act="restore">Restore from pasted backup</button></div>`}
/* ---------- actions ---------- */
const A={
 sbsave:()=>{SB.setup(document.getElementById('sbUrl').value,document.getElementById('sbTok').value);sbMsg(SB.configured()?'Saved. The app now backs itself up once a day.':'Enter the Pocket CRM access token first.',SB.configured());},
 sbnow:async()=>{if(!SB.configured())return sbMsg('Enter the Pocket CRM access token first.',false);sbMsg('Backing up...',true);try{const r=await SB.save(APPID,payload());sbMsg('Backed up'+(r&&r.size_kb?' ('+r.size_kb+' KB)':'')+'.',true)}catch(e){sbMsg(e.message,false)}},
 sbrestore:async()=>{if(!SB.configured())return sbMsg('Enter the Pocket CRM access token first.',false);sbMsg('Loading...',true);let r;try{r=await SB.load(APPID)}catch(e){return sbMsg(e.message,false)}
  const d=r.object;if(!d||d.app!==APPID||!d.data)return sbMsg('That backup does not contain this app\'s data.',false);if(!confirm('Add the latest backup from Notion to this phone? What is here stays; the backup only fills in what is missing.'))return sbMsg('',true);
  const n=merge(d.data);save();render();sbMsg('Restored from the backup of '+new Date(r.at||d.saved).toLocaleString('en-GB')+': '+n+'.',true)},
 grp:e=>{S.grp=e.dataset.g;S.setup=null;S.open=null;save();render()},
 addgrp:()=>{const v=document.getElementById('newg').value.trim();if(!v)return;const g={id:uid(),name:v,members:[]};S.groups.push(g);S.grp=g.id;S.setup=null;save();render()},
 sharegrp:async e=>{const c=groupCode(e.dataset.g);try{await navigator.clipboard.writeText(c);toast(T('Group code copied. Send it to the other phone.'))}catch(x){const t=document.getElementById('joincode');t.value=c;t.select();toast(T('Select all and copy'))}},
 joingrp:()=>{try{let c=document.getElementById('joincode').value.trim();c=c.slice(c.indexOf('.')+1);const d=JSON.parse(decodeURIComponent(escape(atob(c))));if(d.kind!=='group'||!d.groups||!d.groups[0])throw 0;const m=mergeData(d);S.grp=d.groups[0].id;S.setup=null;save();render();toast(T('Joined')+': '+m)}catch(e){toast(T('That is not a valid group code'))}},
 tab:e=>{S.tab=e.dataset.v;save();render()},lang:()=>{S.lang=S.lang==='es'?'en':'es';save();render()},
 selp:e=>{const s=S.setup,i=s.sel.indexOf(e.dataset.p);i>=0?s.sel.splice(i,1):s.sel.push(e.dataset.p);render()},
 seld:e=>{S.setup.dealer=e.dataset.p;render()},selr:e=>{S.setup.rules=e.dataset.r;render()},
 addp:()=>{const v=document.getElementById('newp').value.trim();if(!v)return;const p={id:uid(),name:v};S.players.push(p);grp().members.push(p.id);S.setup.sel.push(p.id);save();render()},
 start:()=>{const s=S.setup;if(s.sel.length<2)return;const g={id:uid(),group:S.grp,u:Date.now(),date:Date.now(),players:[...s.sel],firstDealer:s.dealer,ruleset:s.rules,rounds:[],done:false,over:false};S.games.push(g);S.active=g.id;save();render()},
 out:e=>{document.getElementById('in_'+e.dataset.p).value=0},
 saveround:()=>{const g=S.games.find(x=>x.id===S.active),r={};for(const p of g.players){const v=document.getElementById('in_'+p).value.trim();r[p]=v===''?0:Math.max(0,Math.round(+v)||0)}
  g.rounds.push(r);g.u=Date.now();if(g.rounds.length>=rs(g.ruleset).rounds.length)g.over=true;save();render();window.scrollTo(0,0)},
 undoround:()=>{const g=S.games.find(x=>x.id===S.active);g.rounds.pop();g.over=false;g.u=Date.now();save();render()},
 abandon:()=>{if(!confirm(T('Discard this game? It will not be saved to the leaderboard.')))return;S.games=S.games.filter(g=>g.id!==S.active);S.active=null;save();render()},
 finish:()=>{const g=S.games.find(x=>x.id===S.active);g.done=true;g.u=Date.now();S.active=null;S.tab='lb';save();render();toast(T('Saved to leaderboard'))},
 lbf:e=>{S.lb=e.dataset.v;save();render()},open:e=>{S.open=S.open===e.dataset.g?null:e.dataset.g;render()},
 delgame:e=>{if(!confirm(T('Delete this game and remove it from the leaderboard?')))return;S.del[e.dataset.g]=Date.now();S.games=S.games.filter(g=>g.id!==e.dataset.g);S.open=null;save();render()},
 delp:e=>{const id=e.dataset.p;if(GG().some(g=>g.players.includes(id))){toast(T('Has saved games, cannot remove'));return}grp().members=grp().members.filter(x=>x!==id);if(!S.groups.some(g=>g.members.includes(id))&&!S.games.some(g=>g.players.includes(id)))S.players=S.players.filter(p=>p.id!==id);S.setup=null;save();render()},
 editr:e=>{S.editRules=e.dataset.r;render()},
 newr:()=>{const r={id:uid(),name:'New rules',rounds:[{cards:'',need:''}]};S.rulesets.push(r);S.editRules=r.id;save();render()},
 delr:()=>{if(S.games.some(g=>g.ruleset===S.editRules)){toast(T('Used by saved games'));return}S.rulesets=S.rulesets.filter(r=>r.id!==S.editRules);S.editRules=S.rulesets[0].id;save();render()},
 addround:()=>{rs(S.editRules).rounds.push({cards:'',need:''});rs(S.editRules).placeholder=false;save();render()},
 delround:e=>{const r=rs(S.editRules);if(r.rounds.length>1&&!S.games.some(g=>g.ruleset===r.id)){r.rounds.splice(+e.dataset.i,1);r.placeholder=false;save();render()}else toast(T('Used by saved games or last round'))},
 copybk:async()=>{const t=JSON.stringify(S);try{await navigator.clipboard.writeText(t);S.lastBackup=Date.now();save();toast(T('Backup copied'));render()}catch(e){const ta=document.getElementById('bk');ta.value=t;ta.select();toast(T('Select all and copy'))}},
 restore:()=>{try{const d=JSON.parse(document.getElementById('bk').value);if(!(d.v===1||d.v===2)||!Array.isArray(d.games))throw 0;if(!confirm(T('Replace everything on this phone with the backup?')))return;S=migrate(d);save();render();toast(T('Restored'))}catch(e){toast(T('That is not a valid backup'))}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&A[t.dataset.act])A[t.dataset.act](t)});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.sel!==undefined){S.h2h[+t.dataset.sel]=t.value||null;save();render()}
 else if(t.dataset.g&&t.dataset.r!==undefined&&t.dataset.p){const g=S.games.find(x=>x.id===t.dataset.g);g.rounds[+t.dataset.r][t.dataset.p]=Math.max(0,Math.round(+t.value)||0);g.u=Date.now();save();for(const p of g.players){const c=document.getElementById(`tt_${g.id}_${p}`);if(c)c.textContent=total(g,p)}toast(T('Updated'))}
 else if(t.dataset.gname){const g1=S.groups.find(x=>x.id===t.dataset.gname);g1.name=t.value.trim()||g1.name;save()}
 else if(t.dataset.pname){S.players.find(p=>p.id===t.dataset.pname).name=t.value.trim()||'?';save()}
 else if(t.dataset.rname){rs(t.dataset.rname).name=t.value.trim()||'Rules';rs(t.dataset.rname).placeholder=false;save()}
 else if(t.dataset.rr!==undefined){const r=rs(S.editRules).rounds[+t.dataset.rr];r[t.dataset.f]=t.dataset.f==='cards'?(t.value===''?'':Math.round(+t.value)||''):t.value;rs(S.editRules).placeholder=false;save()}});
SB.auto(APPID,()=>payload().data?payload():null);render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
